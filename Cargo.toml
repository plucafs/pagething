[package]
name = "pagething"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37"
rbook = { version = "0.7", default-features = false, features = ["prelude"] }
htmd = "0.5"
pulldown-cmark = "0.13"
thiserror = "2"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
