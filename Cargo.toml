[package]
name = "pagething"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
rbook = { version = "0.7", default-features = false, features = ["prelude"] }
htmd = "0.5"
pulldown-cmark = "0.13"
thiserror = "2"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
